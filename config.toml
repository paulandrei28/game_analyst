# Game Analyst configuration

[pipeline]
date = "today"
# Paths are relative to this file unless absolute.
output_dir = "output"

[analysis]
top_n = 20
# Optional: uncomment to exclude predictions below this computed value.
# prediction_threshold = 100.0
# Market categories included in the final ranking. Comment out any category
# that is not needed. O/U entries include every available threshold.
enabled_markets = [
	"goals_ou",
	"corners_ou",
	"cards_ou",
	"btts",
	"first_to_score",
	"first_to_concede",
	"first_half_winner",
	"first_half_loser",
	"no_losses",
	"wins",
	"losses",
	"no_wins",
	"no_goals_conceded",
	"no_goals_scored",
	"no_clean_sheet",
]

[fixtures]
# Add a league as one `name = api_id` line. Comment out a line to disable it.
api_timeout_seconds = 10.0

[fixtures.leagues]

